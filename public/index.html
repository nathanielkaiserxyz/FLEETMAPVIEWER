<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleetmap Viewer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
  <h2>FLEETMAP VIEWER</h2>
  <p>Upload a CSV with 6 columns:</p>
  <p><strong>MODEL | SERIAL | ID | CUSTOMER | BUILDING | CUSTOMER NAME</strong></p>

  <input type="file" id="csvFile" accept=".csv">
  <label>
    <input type="checkbox" id="showImage" checked>
    Show image column
  </label>
  <pre id="asciiOutput"></pre>

  <script src="script.js"></script> 
</body>
</html>
